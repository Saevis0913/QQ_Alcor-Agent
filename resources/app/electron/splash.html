<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Alcor Agent</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    cursor: none;            /* 开屏只有画面，没有任何 UI，包括鼠标指针 */
    user-select: none;
  }
  video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; background: #000;
  }
</style>
</head>
<body>
  <video id="video" src="../assets/splash.mp4" muted playsinline preload="auto"></video>
<script>
  const video = document.getElementById('video');
  // 倍速来自设置（设置 → 连接与桌面 → 界面 → 开屏动画倍速），由主进程用查询串传进来。
  // 这里不做任何 UI：只有视频、任意键或鼠标点击跳过。
  const speed = Number(new URLSearchParams(location.search).get('speed'));
  if (Number.isFinite(speed) && speed > 0) video.playbackRate = Math.min(4, Math.max(0.25, speed));
  document.title = 'Alcor Agent · 开屏 ' + video.playbackRate + 'x';

  let closed = false;
  function done() {
    if (closed) return;
    closed = true;
    try { video.pause(); } catch { /* ignore */ }
    window.splashShell?.done();
  }

  window.addEventListener('keydown', () => done(), true);
  window.addEventListener('mousedown', () => done(), true);
  window.addEventListener('pointerdown', () => done(), true);
  window.addEventListener('wheel', () => done(), { passive: true, capture: true });
  window.addEventListener('touchstart', () => done(), { passive: true, capture: true });

  video.addEventListener('ended', done);
  // 解码失败 / 编码不支持：直接进主界面，别把用户卡在黑屏
  video.addEventListener('error', done);
  video.play().catch(() => setTimeout(done, 400));
  // 兜底：视频卡住或时长异常时最多 45 秒
  setTimeout(done, 45_000);
</script>
</body>
</html>
